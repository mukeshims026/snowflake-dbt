# ─────────────────────────────────────────────────────────────────────────────
# profiles.yml — CI/CD safe version
# All sensitive values are read from environment variables injected by
# GitHub Actions. No credentials are hardcoded here.
# ─────────────────────────────────────────────────────────────────────────────

HRPROFILE:       # must match "profile:" in dbt_project.yml
  target: dev            # default target for local runs
  outputs:

    dev:
      type: snowflake
      account:   "{{ env_var('DBT_SF_ACCOUNT') }}"
      user:      "{{ env_var('DBT_SF_USER') }}"
      password:  "{{ env_var('DBT_SF_PASSWORD') }}"
      role:      "{{ env_var('DBT_SF_ROLE') }}"
      warehouse: "{{ env_var('DBT_SF_WAREHOUSE') }}"
      database:  "{{ env_var('DBT_SF_DATABASE') }}"
      schema:    bronze        # base schema; dbt appends +schema per layer
      threads: 4

